<style>
:root{--bg:#0a1020;--c1:#131c31;--c2:#1c2a48;--tx:#e9efff;--mu:#8fa2c8;--g:#22c55e;--b:#38bdf8;--r:#ef4444;--y:#f5b50a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:560px;margin:auto;padding:0 12px 90px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--c2)}
header small{display:block;color:var(--mu);font-size:12px}
button{font:inherit;color:var(--tx);background:var(--c2);border:0;border-radius:12px;padding:12px 14px;min-height:46px;cursor:pointer}
button:active{transform:scale(.97)}button:disabled{opacity:.4}
.pri{background:var(--y);color:#201600;font-weight:700}.ok{background:var(--g);color:#04210f;font-weight:700}.role{background:var(--b);color:#03202e;font-weight:700;padding:10px 12px}
.card{background:var(--c1);border-radius:16px;padding:14px;margin:12px 0}
h2,h3{margin:0 0 8px}h3{font-size:16px}h2{font-size:20px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:9px;background:var(--c2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .8s ease}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--c2);font-size:12px;margin:2px}.up{background:#0f3a24;color:#6df0a2}.dn{background:#431616;color:#ff9a9a}
.mu{color:var(--mu)}.sel{outline:2px solid var(--y);background:#2a2f45}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--c1);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;gap:4px;border-top:1px solid var(--c2)}
nav button{flex:0 0 auto;padding:8px 11px;min-height:44px;font-size:13px;background:none}nav .on{background:var(--c2);color:var(--y)}
.score{font-size:38px;font-weight:800;text-align:center;letter-spacing:2px}.log{max-height:260px;overflow:auto;font-size:14px}.log div{padding:5px 0;border-bottom:1px solid var(--c2)}
.modal{background:var(--c2);border:2px solid var(--y);border-radius:16px;padding:14px;margin:12px 0}.modal button{display:block;width:100%;margin-top:8px;text-align:left}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 3px;text-align:center}td:nth-child(2),th:nth-child(2){text-align:left}tr.me{color:var(--y);font-weight:700}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--c2);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
</style></head><body><div id="app"></div>

 if(m.done){const rs={W:'THẮNG 🎉',D:'HÒA',L:'THUA'}[m.res];h+=`<div class="card"><h3>${rs}</h3>${m.rating?`<p>Điểm của bạn: <b>${m.rating.toFixed(1)}</b> · ${m.g} bàn · ${m.a} kiến tạo</p>`:''}${S.sum?S.sum.map(x=>`<span class="chip ${x[1]>0?'up':'dn'}">${x[0]} ${x[1]>0?'+':''}${x[1]}</span>`).join(''):''}</div><button class="pri" style="width:100%" onclick="nextWeek()">Tuần tiếp theo</button>`}
 else if(m.wait==='ht')h+=(C?tacPanel()+subCard(m):'')+`<button class="pri" style="width:100%" onclick="stepM()">Bắt đầu hiệp 2</button>`;
 else if(m.wait){const a=m.wait.atk;h+=`<div class="card modal"><h3>${m.wait.mn}' Bóng đến chân bạn!</h3>${a?`<button onclick="ch('sht')">🥅 Sút</button><button onclick="ch('pas')">👟 Chuyền</button><button onclick="ch('drb')">💨 Rê bóng</button>`:`<p>Đối thủ đang áp sát khung thành.</p><button onclick="ch('def')">🛡 Tắc bóng</button><button onclick="ch('cov')">🏃 Kèm chặt, chặn đường</button>`}</div>`}
 else h+=(C?tacPanel():'')+`<button style="width:100%;margin-top:8px" onclick="qk()">⏩ Mô phỏng nhanh</button>`;
 return h}
function lay(fm,mine){const f=FM[fm]||FM['4-4-2'],P=[{x:.06,y:.5,l:'GK'}],xs=[.2,.42,.62];f.forEach((n,li)=>{for(let k=0;k<n;k++)P.push({x:xs[li],y:(k+1)/(n+1),l:['DF','MF','FW'][li]})});return P.map(p=>({...p,x:mine?p.x:1-p.x}))}
function draw(c){const m=UI.m,w=c.clientWidth;if(!w||!m)return;const h=Math.round(w*.62);if(c.width!==w*2){c.width=w*2;c.height=h*2;c.style.height=h+'px'}
 const g=c.getContext('2d'),W=c.width,H=c.height,t=performance.now();
 for(let i=0;i<10;i++){g.fillStyle=i%2?'#157a3a':'#188a43';g.fillRect(i*W/10,0,W/10+1,H)}
 g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=3;g.strokeRect(12,12,W-24,H-24);g.beginPath();g.moveTo(W/2,12);g.lineTo(W/2,H-12);g.stroke();g.beginPath();g.arc(W/2,H/2,H*.15,0,7);g.stroke();g.strokeRect(12,H*.27,W*.14,H*.46);g.strokeRect(W-12-W*.14,H*.27,W*.14,H*.46);g.fillStyle='#fff';g.fillRect(4,H*.42,8,H*.16);g.fillRect(W-12,H*.42,8,H*.16);
 const my=lay(S.role==='C'?S.formation:'4-4-2',1),op=lay('4-4-2',0),mo=PV.mo,mp=S.role==='P'?my.findIndex(p=>p.l===S.pos):-1,
 dot=(p,col,i,me)=>{const x=(p.x+mo*.06*(p.l==='GK'?0:1)*(col===1?1:-1)+Math.sin(t/650+i*1.7)*.008)*W,y=(p.y*.86+.07+Math.cos(t/800+i)*.012)*H;g.beginPath();g.arc(x,y,me?15:11,0,7);g.fillStyle=me?'#ffd24a':col===1?'#38bdf8':'#ef4444';g.fill();g.lineWidth=me?4:2;g.strokeStyle=me?'#fff':'rgba(0,0,0,.45)';g.stroke();return{x,y}};
 const A=my.map((p,i)=>dot(p,1,i,i===mp&&(m.starts||m.on))),B=op.map((p,i)=>dot(p,2,i+20,0));let bx,by;const a=PV.atk;
 if(m.wait&&m.wait!=='ht'&&mp>=0){bx=A[mp].x/W;by=A[mp].y/H}
 else if(a){const pr=Math.min(1,(t-a.t0)/a.dur),pts=a.atk?[[.45,.5],[.6,.3],[.78,.55],[.96,.5]]:[[.55,.5],[.4,.7],[.22,.45],[.04,.5]],sg=pr*3,k=Math.min(2,Math.floor(sg)),f=sg-k;bx=pts[k][0]+(pts[k+1][0]-pts[k][0])*f;by=pts[k][1]+(pts[k+1][1]-pts[k][1])*f}
 else{const side=mo>=0?A:B;if(!PV.tg||PV.tgs!==(mo>=0)||t>PV.nt){const d=side[Math.floor(Math.random()*side.length)];PV.tg={x:d.x/W,y:d.y/H};PV.tgs=mo>=0;PV.nt=t+500+Math.random()*500}bx=PV.bx+(PV.tg.x-PV.bx)*.08;by=PV.by+(PV.tg.y-PV.by)*.08}
 PV.bx=bx;PV.by=by;g.beginPath();g.arc(bx*W,by*H,8,0,7);g.fillStyle='#fff';g.fill();g.strokeStyle='#000';g.lineWidth=2;g.stroke();
 const f=PV.fl;if(f&&f.t&&t<f.u){g.globalAlpha=Math.min(1,(f.u-t)/500);g.fillStyle=f.c;g.font='900 '+Math.round(H*.15)+'px system-ui';g.textAlign='center';g.fillText(f.t,W/2,H*.5);g.globalAlpha=1}}
(function loop(){const c=$('#pitch');if(c&&UI.m)draw(c);if(typeof requestAnimationFrame==='function')requestAnimationFrame(loop)})();
const _rd=render;render=function(){_rd();upd()};

/* ----- Chuyển nhượng của cầu thủ, quan hệ có tác dụng, đời sống ----- */
function genOffers(){S.offers=[];const my=tStr(S.team),sc=S.me.ovr+S.fame/8+(S.form-50)/10;
 S.teams.map((t,i)=>i).filter(i=>i!==S.team).sort(()=>Math.random()-.5).forEach(i=>{if(S.offers.length>=3)return;const st=tStr(i),diff=sc-st+4;if(diff<-6&&Math.random()<.8)return;if(Math.random()>.6+(S.listed?.3:0))return;
  S.offers.push({ti:i,wage:Math.round(S.sal*(.95+Math.random()*.5+(st-my)/60)),role:diff>6?'Chủ lực':diff>0?'Luân phiên':'Dự bị',st:Math.round(st)})});
 if(S.offers.length)S.notice.push('📨 Có '+S.offers.length+' CLB gửi lời đề nghị (tab Chuyển nhượng).');S.listed=0}
function takeOffer(k){const o=S.offers[k];if(!o)return;const old=S.teams[S.team];old.sq=old.sq.filter(p=>!p.me);S.teams[o.ti].sq.push(S.me);S.hl.push('bạn rời '+old.n+' để sang '+S.teams[o.ti].n);S.team=o.ti;S.sal=o.wage;S.chem=45;S.tm=50;S.cT=o.role==='Chủ lực'?60:o.role==='Luân phiên'?48:38;S.offers=[];S.flags.moved=(S.flags.moved||0)+1;S.notice=['✍️ Bạn đã ký cho '+S.teams[o.ti].n+', lương '+o.wage+'/tuần. Làm quen đồng đội mới thôi!'];if(S.real)ensureSquad(S.team);save();render()}
function haggle(k){const o=S.offers[k];if(!o)return;if(Math.random()<.5){o.wage=Math.round(o.wage*1.12);S.notice=['💪 Mặc cả thành công, lương tăng lên '+o.wage+'.']}else{S.offers.splice(k,1);S.notice=['😬 CLB rút lại lời đề nghị vì bạn đòi quá cao.']}save();render()}
function listMe(){S.listed=1;S.cT=cl((S.cT==null?50:S.cT)-8);S.notice=['📣 Bạn công khai muốn ra đi. HLV không vui (-8), nhưng các CLB sẽ để ý hơn ở đợt chuyển nhượng sau.'];save();render()}
function applyTo(i){if(S.money<150)return;S.money-=150;const st=tStr(i),p=.25+(S.me.ovr+S.fame/8-st)/40;if(Math.random()<p){S.offers.push({ti:i,wage:Math.round(S.sal*(.9+Math.random()*.4)),role:S.me.ovr>st?'Chủ lực':'Luân phiên',st:Math.round(st)});S.notice=['✅ '+S.teams[i].n+' đồng ý đàm phán. Xem lời đề nghị bên trên.']}else S.notice=['❌ '+S.teams[i].n+' từ chối hồ sơ của bạn.'];save();render()}
function pTr(){const cT=S.cT==null?50:S.cT,O=S.offers||[];
 return`<div class="card"><h3>✍️ Hợp đồng hiện tại</h3><p>${S.teams[S.team].n} · lương <b>${S.sal}</b>/tuần</p>Lòng tin của HLV ${Math.round(cT)}${bar(cT,'var(--y)')}<p class="mu">Lòng tin cao thì được đá chính. Ra sân tốt sẽ tăng, ngồi dự bị hoặc đá tệ sẽ giảm.</p><button style="width:100%" onclick="listMe()">📣 Xin ra đi (tìm bến đỗ mới)</button></div>
 <div class="card"><h3>📨 Lời đề nghị (${O.length})</h3>${O.map((o,k)=>`<div style="padding:8px 0;border-bottom:1px solid var(--c2)"><b>${S.teams[o.ti].n}</b> <span class="chip">Sức mạnh ${o.st}</span><br>Lương ${o.wage}/tuần · Vai trò <b>${o.role}</b><div class="grid" style="margin-top:6px"><button class="ok" onclick="takeOffer(${k})">Ký</button><button onclick="haggle(${k})">Mặc cả +12%</button></div></div>`).join('')||'<p class="mu">Chưa có. Đề nghị thường đến đầu mùa và giữa mùa, hoặc bạn tự gửi hồ sơ bên dưới.</p>'}</div>
 <div class="card"><h3>🏟 Gửi hồ sơ cho CLB (phí 150)</h3>${S.teams.map((t,i)=>i===S.team?'':`<div class="row" style="padding:6px 0"><span>${t.n}<br><small class="mu">Sức mạnh ${Math.round(tStr(i))}</small></span><button onclick="applyTo(${i})">Gửi</button></div>`).join('')}</div>`}
const _tr=trView;trView=function(){return S.role==='C'?_tr():pTr()};
function relAct(i,k){const p=S.teams[S.team].sq[i];if(!p||p.me)return;const now=S.season*100+S.week;if((p.cd||0)>now)return;p.cd=now+3;let m='';
 if(k==='train'){const s=pick(Object.keys(ST));S.st[s]=cl(S.st[s]+1);S.energy=cl(S.energy-10);p.close=cl(p.close+3);m=p.n+' kèm bạn tập riêng: '+ST[s]+' +1.'}
 else if(k==='word'){S.cT=cl((S.cT==null?50:S.cT)+6);p.close=cl(p.close-4);m=p.n+' nói tốt về bạn với HLV: lòng tin +6.'}
 else if(k==='hang'){S.morale=cl(S.morale+6);S.money-=100;p.close=cl(p.close+6);m='Bữa ăn với '+p.n+' khiến hai người thân hơn.'}
 else{S.money+=800;p.close=cl(p.close-8);m=p.n+' cho bạn vay 800, nhưng ơn nghĩa này phải nhớ.'}
 p.mem.push(m.slice(0,38)+' (mùa '+S.season+')');syncMe();S.notice=['🤝 '+m];save();render()}
function pRel(){const sq=S.teams[S.team].sq,now=S.season*100+S.week;
 return`<div class="card"><h3>🤝 Quan hệ có tác dụng</h3><p class="mu">Đồng đội thân thì bóng đến chân bạn nhiều hơn và đường chuyền ăn ý hơn. Người ghen tị với bạn sẽ ít chuyền cho bạn. Nhờ vả được, nhưng mỗi lần nhờ sẽ tốn một chút quan hệ.</p></div>`+sq.map((p,i)=>[p,i]).filter(x=>!x[0].me).sort((a,b)=>b[0].close-a[0].close).slice(0,12).map(([p,i])=>`<div class="card"><div class="row"><b>${p.n}</b><small class="mu">${p.pos} · ${p.tr}${p.envy>60?' · 😠':''}</small></div><div class="grid"><small>Thân thiết${bar(p.close,'var(--b)')}</small><small>Tin tưởng${bar(p.trust,'var(--g)')}</small></div>${(p.cd||0)>now?'<small class="mu">Vừa nhờ, chờ vài tuần…</small>':`<div class="grid" style="margin-top:6px"><button ${p.close<45?'disabled':''} onclick="relAct(${i},'train')">🏋 Tập riêng</button><button ${p.trust<60?'disabled':''} onclick="relAct(${i},'word')">🗣 Nói tốt với HLV</button><button onclick="relAct(${i},'hang')">🍜 Rủ đi ăn</button><button ${p.close<70?'disabled':''} onclick="relAct(${i},'loan')">💸 Nhờ cho vay</button></div>`}${p.mem.length?`<div class="mu"><small>Nhớ: ${p.mem[p.mem.length-1]}</small></div>`:''}</div>`).join('')}
const _rv=relView;relView=function(){return S.role==='P'?pRel():_rv()};
function lifeCard(){const L=S.life||{},H=S.hap==null?60:S.hap,I=[['trainer','Huấn luyện viên cá nhân',2500,'+1 chỉ số ngẫu nhiên nhiều tuần'],['chef','Đầu bếp riêng',1500,'+5 thể lực mỗi tuần'],['car','Xe sang',6000,'+hạnh phúc, +danh tiếng'],['house','Biệt thự',15000,'+hạnh phúc, +5 thể lực mỗi tuần']];
 return`<div class="card"><h3>🏡 Đời sống</h3>Hạnh phúc ${Math.round(H)}${bar(H,'#f472b6')}<p class="mu">${S.flags.love?'Có người yêu':'Độc thân'}${S.flags.wed?' · Đã kết hôn':''}${S.flags.kid?' · Có con':''}. Hạnh phúc thấp kéo phong độ xuống.</p>${I.map(x=>`<div class="row" style="padding:5px 0"><span>${x[1]}<br><small class="mu">${x[3]}</small></span>${L[x[0]]?'<span class="chip up">Đã có</span>':`<button ${S.money<x[2]?'disabled':''} onclick="buyLife('${x[0]}')">${x[2]}</button>`}</div>`).join('')}</div>`}
function buyLife(k){const c={trainer:2500,chef:1500,car:6000,house:15000}[k];if(S.money<c||(S.life||{})[k])return;S.money-=c;(S.life=S.life||{})[k]=1;S.hap=cl((S.hap==null?60:S.hap)+({car:6,house:10}[k]||2));if(k==='car')S.fame=cl(S.fame+2);save();render()}
const _cv=cView;cView=function(){return(S.role==='P'?lifeCard():'')+_cv()};
const _nw=nextWeek;nextWeek=function(){_nw();if(!S||UI.end)return;
 if(MD()==='P'){const L=S.life||{},H=S.hap==null?60:S.hap;S.energy=cl(S.energy+(L.chef?5:0)+(L.house?5:0));if(L.trainer&&Math.random()<.35){const k=pick(Object.keys(ST));S.st[k]=cl(S.st[k]+1)}
  S.hap=cl(H+(L.house?1:0)+(L.car?.5:0)+(S.money<150?-2:0)+(S.form>60?1:S.form<35?-1.5:0)+(50-H)*.05);if(S.hap<28){S.form=cl(S.form-3);S.notice.push('😞 Cuộc sống riêng đang đè nặng, phong độ sa sút.')}
  if(S.week===1||S.week===10||S.listed)genOffers()}
 save();render()};
const _se=seasonEnd;seasonEnd=function(){_se();if(S.mode!=='C'&&S.ret){UI.end=true;UI.se=null;save();render()}};
render();
</script></body></html>
