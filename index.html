<style>
:root{--bg:#0a1020;--c1:#131c31;--c2:#1c2a48;--tx:#e9efff;--mu:#8fa2c8;--g:#22c55e;--b:#38bdf8;--r:#ef4444;--y:#f5b50a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:560px;margin:auto;padding:0 12px 90px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--c2)}
header small{display:block;color:var(--mu);font-size:12px}
button{font:inherit;color:var(--tx);background:var(--c2);border:0;border-radius:12px;padding:12px 14px;min-height:46px;cursor:pointer}
button:active{transform:scale(.97)}button:disabled{opacity:.4}
.pri{background:var(--y);color:#201600;font-weight:700}.ok{background:var(--g);color:#04210f;font-weight:700}.role{background:var(--b);color:#03202e;font-weight:700;padding:10px 12px}
.card{background:var(--c1);border-radius:16px;padding:14px;margin:12px 0}
h2,h3{margin:0 0 8px}h3{font-size:16px}h2{font-size:20px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:9px;background:var(--c2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .8s ease}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--c2);font-size:12px;margin:2px}.up{background:#0f3a24;color:#6df0a2}.dn{background:#431616;color:#ff9a9a}
.mu{color:var(--mu)}.sel{outline:2px solid var(--y);background:#2a2f45}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--c1);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;gap:4px;border-top:1px solid var(--c2)}
nav button{flex:0 0 auto;padding:8px 11px;min-height:44px;font-size:13px;background:none}nav .on{background:var(--c2);color:var(--y)}
.score{font-size:38px;font-weight:800;text-align:center;letter-spacing:2px}.log{max-height:260px;overflow:auto;font-size:14px}.log div{padding:5px 0;border-bottom:1px solid var(--c2)}
.modal{background:var(--c2);border:2px solid var(--y);border-radius:16px;padding:14px;margin:12px 0}.modal button{display:block;width:100%;margin-top:8px;text-align:left}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 3px;text-align:center}td:nth-child(2),th:nth-child(2){text-align:left}tr.me{color:var(--y);font-weight:700}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--c2);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}

function investOut(){S.money+=S.invest||0;S.invest=0;save();render()}
function buildAcad(){if(S.money<20000||(S.life||{}).academy)return;S.money-=20000;(S.life=S.life||{}).academy=1;S.legacy=(S.legacy||0)+5;S.fame=cl(S.fame+5);save();render()}
function stadCard(){const l=S.stad||0;return`<div class="card"><h3>🏟 Sân vận động (cấp ${l}/3)</h3><p class="mu">Mỗi cấp tăng thu nhập 180 mỗi tuần. Quỹ lương cũng tốn ngân sách mỗi tuần, nên đừng để ngân sách âm.</p><button ${l>=3||S.budget<5000*(l+1)?'disabled':''} onclick="upStad()">Nâng cấp (${5000*(l+1)})</button></div>`}
function upStad(){const l=S.stad||0,c=5000*(l+1);if(l>=3||S.budget<c)return;S.budget-=c;S.stad=l+1;save();render()}

/* ----- Các thẻ giao diện nhỏ ----- */
function heroCard(){return`<div class="card" style="display:flex;gap:14px;align-items:center"><div class="ovr">${S.role==='C'?Math.round(S.coach.rep):S.me.ovr}</div><div><b>${S.name}</b><br><small class="mu">${S.role==='C'?'Uy tín HLV · Tầm nhìn '+Math.round(S.coach.vis):S.pos+' · Danh tiếng '+Math.round(S.fame)+' · Phong độ '+Math.round(S.form)}</small>${S.role==='P'?`<div style="margin-top:4px"><small>HLV tin bạn ${Math.round(S.cT==null?50:S.cT)}</small>${bar(S.cT==null?50:S.cT,'var(--y)')}</div>`:''}</div></div>`}
function gkCard(){return S.pos==='GK'&&S.role==='P'&&S.gk?`<div class="card"><h3>🧤 Thủ môn</h3><div class="grid"><div>Giữ sạch lưới<br><b>${S.gk.cs}</b></div><div>Pha cứu thua<br><b>${S.gk.saves}</b></div></div></div>`:''}
function soundCard(){return`<div class="card"><h3>🔊 Âm thanh</h3><button style="width:100%" onclick="S.snd=(S.snd===false);SFX.on=S.snd!==false;if(!SFX.on)SFX.amb(0);save();render()">${S.snd===false?'Đang tắt. Bấm để bật':'Đang bật. Bấm để tắt'}</button></div>`}

/* ----- Các hàm chính (mỗi hàm gọi lõi gốc *Core một lần, cộng thêm các phần mở rộng theo thứ tự rõ ràng) ----- */
function newGame(i,n,p,t){const role=UI.role||'P',bk=($('#nb')||{}).value,tk=($('#nz')||{}).value;newCore(i,n,p,t);if(!S)return;
 S.mode=role;S.cT=50;S.hap=60;S.life={};S.offers=[];S.ts={st:'possess',line:'mid',tempo:'mid',press:'mid'};
 if(role==='C'){S.role='C';S.ret=true;S.age=35;S.me.age=35;S.me.inj=99;S.lineupSelf=false;S.coach={tac:35,trn:35,hr:35,vis:35,rep:25};S.budget=6000;S.csal=600}
 applyBG(bk,tk);ex();
 if(p==='GK'&&S.role==='P'&&!S.gkInit){S.gkInit=1;S.st.def=cl(S.st.def+8);S.st.spd=cl(S.st.spd+4);S.st.sht=cl(S.st.sht-4);S.st.drb=cl(S.st.drb-2);S.gk={cs:0,saves:0};syncMe()}
 UI.tab='week';save();render()}
function render(){stLabels();if(S&&S.pos==='GK'&&!S.gk)S.gk={cs:0,saves:0};ex();if(S)SFX.on=S.snd!==false;
 const A=$('#app'),oc=$('#pitch'),k=[UI.tab,!!S,!!UI.se,!!UI.modal,!!UI.end,!!(UI.m&&UI.m.wait)].join();A.className=k!==UI.rk?'ani':'';UI.rk=k; // chỉ animate khi đổi màn hình
 renderCore();const nc=$('#pitch');if(oc&&nc&&oc!==nc)nc.replaceWith(oc);upd()} // giữ nguyên canvas để sân không chớp
function resM(w,ch){const m=UI.m;if(!m)return;const a=m.sc[0],b=m.sc[1],gk=S.pos==='GK'&&GKMAP[ch]?ch:null;let g0,p0,c0,h0,d0,isD;
 if(gk){p0=m.perf;g0=m.g;c0=m.sc[1];h0=m.sc[0];d0=S.st.def;isD=gk==='save'||gk==='punch'||gk==='rush';if(isD)S.st.def=cl(d0+(S.st.sht-50)/6+(gk==='rush'?12:0));if(gk==='rush')w.pg=.5}
 S.rbT=relBoost();try{resCore(w,gk?GKMAP[gk]:ch)}finally{S.rbT=0;if(gk)S.st.def=d0}
 const goal=m.sc[0]!==a||m.sc[1]!==b,mine=m.sc[0]>a;
 PV.fl={t:goal?'⚽ BÀN THẮNG!':'',c:mine?'#ffd24a':'#ff6b6b',u:performance.now()+1600};if(goal){SFX.roar();if(navigator.vibrate)navigator.vibrate(150)}
 if(gk){const ok=m.perf>p0,oppG=m.sc[1]>c0,myG=m.sc[0]>h0;if(m.g>g0){m.a+=m.g-g0;m.g=g0}if(isD&&ok&&S.gk)S.gk.saves++;
  const T={save:ok?'🧤 Bạn bắt chắc cú sút, bóng nằm gọn trong tay.':oppG?'😬 Bóng lọt qua tay bạn, đối thủ ghi bàn.':'😮 Bạn chậm nhịp nhưng cú sút đi chệch.',
   punch:ok?'🥊 Phản xạ xuất sắc, bạn đấm bóng ra ngoài!':oppG?'😬 Bạn chạm bóng nhưng không đủ lực, bóng vẫn vào lưới.':'😮 Bạn bay người, may mắn bóng đi chệch.',
   rush:ok?'🏃 Bạn lao ra đúng lúc, triệt hạ cơ hội!':oppG?'😱 Bạn lao ra quá chậm, bóng lăn vào khung thành trống.':'😮 Bạn lao ra hụt, nhưng đối thủ sút hỏng.',
   long:ok?(myG?'🚀 Quả phát bóng dài của bạn mở ra bàn thắng cho đội!':'🚀 Quả phát bóng dài tạo ra cơ hội nguy hiểm.'):'❌ Quả phát bóng bị đối thủ cắt, mất bóng.',
   short:ok?(myG?'🧤 Đường chuyền ngắn của bạn khởi đầu pha ghi bàn đẹp!':'🧤 Bạn chuyền ngắn an toàn, đội giữ được bóng.'):'❌ Bạn chuyền hỏng, may mà đối thủ không tận dụng được.'};
  m.log[m.log.length-1]=w.mn+"' "+T[gk];render()}
 if(PS.m===m){const tm=w.atk?1:2,sc=tm===1?m.sc[0]>a:m.sc[1]>b;psFinish(tm,sc);if(sc)setTimeout(psClip,1500)}}
function endM(){const m=UI.m;if(!m||m.done)return;clearInterval(UI.iv);
 const gk=S.pos==='GK'&&S.role==='P'&&(m.starts||m.on),clean=gk&&m.sc[1]===0;if(gk){if(clean){m.perf+=1.5;if(S.gk)S.gk.cs++}else if(m.sc[1]>=3)m.perf-=1.2}
 endCore();
 if(S.role==='P'){const c=S.cT==null?50:S.cT;if(m.rating!=null)S.cT=cl(c+(m.rating>=7?2:m.rating<5.5?-2:0));else if(!(m.starts||m.on))S.cT=cl(c-1)}
 SFX.whistle();SFX.amb(0);
 const h=derbyHeat(m.opp);if(h)derbyDone(m,h);
 if(clean)S.news='🧤 '+S.name+' giữ sạch lưới, đội nhà không để thủng lưới trận này.';
 econ();refreshSum();chk();save();render()}
function nextWeek(){ex();const wk=S.week;nextCore();if(!S||UI.end)return;
 if(MD()==='P'){const L=S.life||{},H=S.hap==null?60:S.hap;S.energy=cl(S.energy+(L.chef?5:0)+(L.house?5:0));if(L.trainer&&Math.random()<.35){const k=pick(Object.keys(ST));S.st[k]=cl(S.st[k]+1)}
  S.hap=cl(H+(L.house?1:0)+(L.car?.5:0)+(S.money<150?-2:0)+(S.form>60?1:S.form<35?-1.5:0)+(50-H)*.05);if(S.hap<28){S.form=cl(S.form-3);S.notice.push('😞 Cuộc sống riêng đang đè nặng, phong độ sa sút.')}
  if(S.money<0)S.notice.push('💸 Bạn đang nợ tiền, hạnh phúc sẽ giảm.');if(S.week===1||S.week===10||S.listed)genOffers()}
 else if(S.budget<-2000)S.notice.push('📉 Ngân sách âm, ban lãnh đạo bắt đầu lo ngại.');
 if(S.week===wk+1)cupRound(wk);if(S.as&&S.as.sct)S.scT={w:S.week,lvl:2};
 save();render()}
function seasonEnd(){ex();const o=ranking(),rank=o.findIndex(x=>x[0]===S.team)+1,done=S.season,P=MD()==='P',obj=S.obj,div=S.div;seasonCore();if(!S)return;
 if(S.mode!=='C'&&S.ret){UI.end=true;UI.se=null}
 const add=t=>{if(UI.se)UI.se.story.push(t)};
 if(!P){const ok=rank<=obj;S.bd=cl(S.bd+(ok?20:-25)+(rank===1?10:0));add(ok?`Ban lãnh đạo hài lòng vì bạn đạt mục tiêu top ${obj}.`:`Ban lãnh đạo thất vọng: hạng ${rank}, mục tiêu là top ${obj}.`);if(S.bd<=0&&!S.sacked){S.sacked=true;UI.end=true;UI.se=null}}
 if(done%2===0){const el=P?(S.fame>=35&&S.me.ovr>=58&&!S.ret):(S.coach.rep>=55);if(el){const t=tourney(done);if(P){S.nt.caps++;S.nt.goals+=t.goals;if(t.champ)S.nt.titles++;S.fame=cl(S.fame+t.st*2+(t.champ?8:0));S.money+=t.st*500}else{S.coach.rep=cl(S.coach.rep+t.st*1.5)}add(`🌍 ${t.n}: ${P?'bạn khoác áo đội tuyển, ':'bạn dẫn dắt đội tuyển, '}${t.txt}${P&&t.goals?` (${t.goals} bàn)`:''}.`)}else if(P)add('Bạn chưa được gọi lên đội tuyển quốc gia mùa này.')}
 if(!S.real){const rep=(i,dv)=>{const u=new Set(S.teams.map(t=>t.n)),pool=(dv===1?CFG.teams:DIV2).filter(x=>!u.has(x));S.teams[i]=newTeam(pool[0]||('CLB '+r(10,99)),dv)};
  if(div===1){const bot=[o[8][0],o[9][0]];if(bot.includes(S.team)){const oth=bot.find(x=>x!==S.team);S.div=2;S.teams.forEach((t,i)=>{if(i!==S.team&&i!==oth)rep(i,2)});add('📉 '+S.teams[S.team].n+' xuống hạng, mùa tới đá giải Hạng Nhì.');S.fame=cl(S.fame-3);S.tm=cl(S.tm-10)}else{bot.forEach(i=>rep(i,2));add('Hai đội cuối bảng xuống hạng, hai đội mới lên thay.')}}
  else{const top=[o[0][0],o[1][0]];if(top.includes(S.team)){const oth=top.find(x=>x!==S.team);S.div=1;S.teams.forEach((t,i)=>{if(i!==S.team&&i!==oth)rep(i,1)});add('📈 '+S.teams[S.team].n+' thăng hạng lên giải cao nhất!');S.fame=cl(S.fame+4);S.flags.promo=(S.flags.promo||0)+1}else top.forEach(i=>rep(i,1))}}
 if(!P&&S.acad>0){const sq=S.teams[S.team].sq;for(let k=0;k<S.acad&&sq.length<22;k++){const y=mkP(36+S.acad*4,1);y.age=r(16,18);y.pot=cl(65+S.acad*8+r(0,10),0,95);sq.push(y)}add(`🏫 Học viện đưa ${S.acad} cầu thủ trẻ lên đội một.`)}
 if(P&&S.invest>0){const g=r(-15,30)/100,v=Math.round(S.invest*(1+g));add(`📈 Khoản đầu tư ${g>=0?'sinh lời':'thua lỗ'} ${Math.abs(Math.round(g*100))}%: ${S.invest} thành ${v}.`);S.invest=v}
 S.euro=S.div===1&&rank<=2&&!S.real;if(S.euro)add('🇪🇺 Mùa tới bạn được dự Cúp châu Âu.');
 cupsInit();setObj();S.scT=null;chk();save();render()}
function stepM(){const m=UI.m;if(m&&!m.dl){const h=derbyHeat(m.opp);if(h){m.dl=1;m.log.push('🔥 DERBY với '+S.teams[m.opp].n+'! '+derbyLabel(h)+'.');SFX.amb(.2)}}stepCore()}
function mS(){const x=msCore(),m=UI.m,h=m?(m.dh==null?(m.dh=derbyHeat(m.opp)):m.dh):0;if(h){const b=1+h*.3;x.ma+=b;x.oa+=b}return x}
function tickMo(){tickCore();const m=UI.m;SFX.amb(.03+Math.abs(PV.mo)*.07);if(S.as&&S.as.fit&&m.fat)m.fat*=.992}
async function playWeek(q){await playCore(q);SFX.whistle()}
function tacFx(o){const f=tacCore(o);if(S.as&&S.as.tac){f.a+=1;f.d+=1}return f}
function cupRound(wk){const g0=S.goals,s0=S.sg;cupCore(wk);if(S.pos==='GK'&&S.role==='P'){S.goals=g0;S.sg=s0;S.notice=S.notice.map(x=>x.replace(' · bạn ghi bàn!',''))}}
function tourney(n){const t=tourneyCore(n);if(S.pos==='GK')t.goals=0;return t}
function mView(){let h=mvCore();const m=UI.m;if(S.pos==='GK'&&S.role==='P'&&m&&m.wait&&m.wait!=='ht'){const a=m.wait.atk;h=h.replace(/<div class="card modal">[\s\S]*?<\/div>/,`<div class="card modal"><h3>${m.wait.mn}' ${a?'Bóng trong tay bạn, cả đội chờ lệnh!':'Cú sút đang bay về phía bạn!'}</h3>${a?`<button onclick="ch('long')">🚀 Phát bóng dài</button><button onclick="ch('short')">🧤 Chuyền ngắn an toàn</button>`:`<button onclick="ch('save')">🧤 Bắt bóng chắc chắn</button><button onclick="ch('punch')">🥊 Đấm bóng ra (dựa vào phản xạ)</button><button onclick="ch('rush')">🏃 Lao ra cản góc (rủi ro cao)</button>`}</div>`)}return h}
function wView(){return derbyCard()+heroCard()+(S.role==='C'?scoutCard():'')+wCore()}
function cView(){return gkCard()+(S.role==='P'?lifeCard()+moneyCard():'')+cCore()}
function trView(){return S.role==='C'?clubCard()+stadCard()+trCore():pTr()}
function relView(){return S.role==='P'?pRel():relCore()}
function sqView(){return(S.role==='C'?tacPanel():'')+sqCore()}
function setView(){return setCore()+soundCard()}
render();
</script></body></html>
